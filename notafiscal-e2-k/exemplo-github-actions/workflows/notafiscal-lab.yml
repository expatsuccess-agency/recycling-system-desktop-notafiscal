name: NotaFiscal RJ offline security checks
on:
  push:
    paths:
      - 'notafiscal-e2-k/**'
      - '.github/workflows/notafiscal-lab.yml'
  pull_request:
    paths:
      - 'notafiscal-e2-k/**'
      - '.github/workflows/notafiscal-lab.yml'
permissions:
  contents: read
jobs:
  test-lab:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: notafiscal-e2-k/requirements-dev.txt
      - name: Dependencias de laboratorio
        run: python -m pip install -r notafiscal-e2-k/requirements-dev.txt
      - name: Teste local, sem SEFAZ
        working-directory: notafiscal-e2-k
        run: python -m pytest -q
      - name: Evidencias pendentes por padrão
        working-directory: notafiscal-e2-k
        run: python -m tools.notafiscal.readiness > /dev/null
